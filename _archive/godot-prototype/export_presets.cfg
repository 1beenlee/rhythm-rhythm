html/head_include="<script>(function(){const prefix=\"Rhythm Rhythm-sw-cache-\";const required=[\"index.html\",\"index.js\",\"index.offline.html\",\"index.icon.png\",\"index.png\",\"index.apple-touch-icon.png\",\"index.audio.worklet.js\",\"index.audio.position.worklet.js\",\"index.manifest.json\",\"index.144x144.png\",\"index.180x180.png\",\"index.512x512.png\",\"index.wasm\",\"index.pck\"];window.rhythmOfflineReady=false;window.addEventListener(\"load\",async function(){if(!(\"serviceWorker\" in navigator)||!(\"caches\" in window))return;try{await navigator.serviceWorker.register(\"./index.service.worker.js\");await navigator.serviceWorker.ready;const names=(await caches.keys()).filter(n=>n.startsWith(prefix));if(!names.length)throw Error(\"Godot offline cache was not created\");const cache=await caches.open(names[names.length-1]);const missing=[];for(const path of required){if(!await cache.match(path))missing.push(path)}if(missing.length)await cache.addAll(missing);window.rhythmOfflineReady=true;document.documentElement.dataset.rhythmOffline=\"ready\";}catch(err){console.warn(\"Rhythm Rhythm offline setup incomplete:\",err);document.documentElement.dataset.rhythmOffline=\"incomplete\";}})})();</script>"
