name: Godot MVP validation
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate charts and scaffold test
        run: |
          python tools/validate.py
          python -m unittest discover -s tests -v
      - name: Fetch pinned Godot editor and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 2 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Godot import, parse and runtime smoke gate
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          chmod +x "$GODOT"
          "$GODOT" --headless --path . --import 2>&1 | tee /tmp/rhythm-import.log
          "$GODOT" --headless --path . --script tests/godot_judge_test.gd 2>&1 | tee /tmp/rhythm-judge.log
          "$GODOT" --headless --path . --script tests/godot_session_test.gd 2>&1 | tee /tmp/rhythm-session.log
          "$GODOT" --headless --path . --script tests/godot_smoke_test.gd 2>&1 | tee /tmp/rhythm-smoke.log
          "$GODOT" --headless --path . --quit-after 2 2>&1 | tee /tmp/rhythm-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/rhythm-{import,judge,session,smoke,runtime}.log; then
            echo 'Godot reported a GDScript parse/load error' >&2
            exit 1
          fi
          grep -q 'RhythmJudge: PASS' /tmp/rhythm-judge.log
          grep -q 'RhythmSessionRegression: PASS' /tmp/rhythm-session.log
          grep -q 'RhythmAppSmoke: PASS' /tmp/rhythm-smoke.log
      - name: Export Web PWA and Windows
        run: |
          GODOT=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build/web build/windows
          "$GODOT" --headless --path . --export-release 'Web' build/web/index.html
          "$GODOT" --headless --path . --export-release 'Windows Desktop' build/windows/RhythmRhythm.exe
          test -s build/web/index.html
          test -s build/windows/RhythmRhythm.exe
          python tools/check_web_export.py build/web
          node tests/web_bootstrap_test.cjs build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f\n'
      - name: Pack offline build artifacts (not release)
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-rhythm-mvp-test-builds
          path: |
            build/web/
            build/windows/
          retention-days: 2
